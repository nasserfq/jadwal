[package]
name = "gridcraft-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft's tiny self-contained PDF 1.7 writer (standard 14 fonts, vector drawing, RGBA images)"
readme = "README.md"

[lints]
workspace = true

[dependencies]
harfrust = { version = "0.12", default-features = false, features = ["std"] }
read-fonts = { version = "0.41", default-features = false, features = ["std"] }
unicode-bidi = "0.3"
